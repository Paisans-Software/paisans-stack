# The spec's end state: home-a running alone, home-b joining as a data site,
# vm gaining the witness role. Addresses are documentation ranges.
version: 1

community:
  name: "Fixture Community"
  domain: example.org

mesh:
  subnet: 10.44.0.0/24

acme:
  provider: desec

sites:
  home-a:
    roles: [data, apps]
    address: 10.44.0.1
    public_address: 203.0.113.10
    endpoint: 203.0.113.10:51820
    ssh:
      user: ubuntu
      public_key: |
        ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA alice@example.org
  home-b:
    roles: [data]
    address: 10.44.0.2
    public_address: 203.0.113.20
    endpoint: 203.0.113.20:51820
    ssh:
      user: ubuntu
      public_key: |
        ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA alice@example.org
  vm:
    roles: [gateway, witness]
    address: 10.44.0.3
    public_address: 203.0.113.30
    endpoint: 203.0.113.30:51820
    ssh:
      user: ubuntu
      port: 2222
      public_key: |
        ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA alice@example.org

cluster:
  sites: [home-a, home-b]
  port: 5000
  postgres_version: "18"
  synchronous: true
  synchronous_strict: false

storage:
  garage:
    sites: [home-a]
    replication: 1

etcd:
  members: [home-a, home-b, vm]
  heartbeat_ms: 100
  election_timeout_ms: 1000

apps:
  auth:
    kind: pocket-id
    hostname: id.example.org
    placement: cluster
    settings:
      file_backend: database
  blog:
    kind: writefreely
    hostname: blog.example.org
    placement: cluster
