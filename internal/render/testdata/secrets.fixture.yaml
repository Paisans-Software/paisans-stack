  superuser_password: "fixture-not-a-secret-superuser"
  admin_password: "fixture-not-a-secret-admin"
  standby_password: "fixture-not-a-secret-standby"

storage:
  garage:
    admin_token: "fixture-not-a-secret-admin-token"
    rpc_secret: "fixture-not-a-secret-rpc"
    access_key_id: "fixture-not-a-secret-key-id"
    secret_access_key: "fixture-not-a-secret-access-key"

