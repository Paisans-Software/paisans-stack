    admin_token: "fixture-not-a-secret-admin-token"
    # 64 hex characters, because Garage parses rpc_secret as a hex encoded
    # 32 byte key and refuses to start against anything else. Fixed, fake,
    # and deliberately not random: the golden tree has to be reproducible.
    rpc_secret: "dead0fadedfacadedecadeb0ad1deacc0ffeebadfeed0dd5deadbeef5eedcab5"

# The heartbeat token is what the site's host pushes to each monitor with:
# 32 hex characters, fixed and fake for the same reason as the keys.
