# A PLAINTEXT fixture. Nothing here is a credential: every value is a fixed
# placeholder, and the WireGuard keys are repeated bytes chosen so that the
# derived public keys are stable across runs. A real deployment's secrets live
# in secrets.enc.yaml under sops and are never committed in this form.
version: 1

cluster:
  superuser_password: "fixture-not-a-secret-superuser"
  admin_password: "fixture-not-a-secret-admin"
  standby_password: "fixture-not-a-secret-standby"

storage:
  garage:
    admin_token: "fixture-not-a-secret-admin-token"
    rpc_secret: "fixture-not-a-secret-rpc"
    access_key_id: "fixture-not-a-secret-key-id"
    secret_access_key: "fixture-not-a-secret-access-key"

sites:
  home-a: { wireguard_private_key: "QEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEA=" }
  home-b: { wireguard_private_key: "QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=" }
  vm:     { wireguard_private_key: "QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=" }

apps:
  talk:
    database_password: "fixture-not-a-secret-talk-db"
    mercure_jwt_secret: "fixture-not-a-secret-mercure"
    rabbitmq_password: "fixture-not-a-secret-rabbitmq"
    valkey_password: "fixture-not-a-secret-valkey"
  docs:
    database_password: "fixture-not-a-secret-docs-db"
  auth:
    database_password: "fixture-not-a-secret-auth-db"
  chat:
    database_password: "fixture-not-a-secret-chat-db"
  notes:
    database_password: "fixture-not-a-secret-notes-db"

external:
  cloudflare_api_token: "fixture-not-a-secret-cloudflare"
  smtp_password: "fixture-not-a-secret-smtp"

oidc_clients:
  talk:
    client_id: "fixture-not-a-secret-talk-id"
    client_secret: "fixture-not-a-secret-talk-secret"
  docs:
    client_id: "fixture-not-a-secret-docs-id"
    client_secret: "fixture-not-a-secret-docs-secret"
