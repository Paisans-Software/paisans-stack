# A PLAINTEXT fixture. Nothing here is a credential: every value is a fixed
# placeholder, and the WireGuard keys are repeated bytes chosen so that the
# derived public keys are stable across runs. A real deployment's secrets live
# in secrets.enc.yaml under sops and are never committed in this form.
