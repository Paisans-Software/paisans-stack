# The fixture deployment. It exercises both placements: three clustered apps
# and one pinned, on three sites with one stable endpoint.
version: 1

community:
  name: "Fixture Community"
  domain: example.org

mesh:
  subnet: 10.44.0.0/24

acme:
  provider: desec

sites:
  home-a:
    roles: [data, apps]
    address: 10.44.0.1
    ssh: home-a.local
  home-b:
    roles: [data, apps]
    address: 10.44.0.2
    ssh: home-b.local
  vm:
    roles: [gateway, witness]
    address: 10.44.0.3
    endpoint: vm.example.org:51820
    ssh: vm.example.org

cluster:
  sites: [home-a, home-b]
  port: 5000
  postgres_version: "18"
  synchronous: true
  synchronous_strict: false

etcd:
  members: [home-a, home-b, vm]
  heartbeat_ms: 200
  election_timeout_ms: 2000

storage:
  garage:
    sites: [home-a, home-b]
    replication: 2

apps:
  talk:
    kind: mbin
    hostname: talk.example.org
    placement: cluster
    images:
      app: ghcr.io/example-org/mbin:v1.10.1-fork
  docs:
    kind: outline
    hostname: docs.example.org
    placement: cluster
    settings:
      s3_force_path_style: true
      s3_bucket: docs-uploads
  auth:
    kind: pocket-id
    hostname: id.example.org
    placement: cluster
    settings:
      file_backend: database
  chat:
    kind: synapse
    hostname: chat.example.org
    placement: { pinned: vm }
    images:
      postgres: postgres:17-alpine
  blog:
    kind: writefreely
    hostname: blog.example.org
    # Pinned because it cannot be anything else: no Postgres, so a SQLite file
    # per apps site would be two divergent blogs behind one hostname.
    placement: { pinned: home-a }
