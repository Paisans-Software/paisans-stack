# Rendered by paisans. Do not edit: `paisans apply` overwrites this file.
#
# The whole Mbin stack, in the shape upstream's own compose.yaml has (read at
# the paisans fork's tag v1.13.3+paisans): the web application, its messenger
# consumers, a message broker behind an AMQP proxy, and a cache. Only `app`
# publishes a port. Every other service is on this project's own network and
# reachable from nothing else.
#
# talk has cluster placement: no Postgres service of its own, and a
# connection to the local HAProxy on 10.44.0.2:5000, this site's own
# mesh address. Every apps site runs this same stack with its own broker and
# cache. Sessions are in Postgres (the image's framework.yaml uses
# PdoSessionHandler), so a member keeps their session when the gateway moves
# to another site; the queue and the cache are per site and are not. Each
# site's consumers also run Mbin's scheduled tasks (the scheduler_default
# transport), so with two apps sites each task runs once per site. Whether
# every task tolerates that has not been checked.
#
# OWNERSHIP. Every directory below is a bind mount under /srv/talk, and
# whoever creates a missing one owns it: Docker creates it as root. The
# containers cope with that as follows, and nothing here chowns anything:
#
#   app, messenger  start as root; the image's entrypoint chowns var/, /data
#                   and /config to MBIN_USER (1000:1000, set in .env) and then
#                   drops to it. media/ and oauth/ are NOT chowned. media/ is
#                   unused while uploads go to S3; oauth/ must be readable by
#                   uid 1000 (see below).
#   rabbitmq        starts as root; its entrypoint chowns /var/lib/rabbitmq to
#                   its own user and drops to it. No `user:` here for that
#                   reason, which is a deliberate difference from upstream.
#   valkey          mounts only valkey.conf, read only, so owns nothing.
#   amqproxy        mounts nothing.
name: paisans-talk

services:
  app:
    image: ghcr.io/example-org/mbin:v1.10.1-fork
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The image is FrankenPHP, which is Caddy, and by default it terminates
      # TLS itself and asks for a certificate for SERVER_NAME. The gateway
      # terminates TLS, so this listens plainly on the port it publishes and
      # never attempts ACME. Upstream's documented pattern for running behind a
      # reverse proxy (docs/02-admin/01-installation/02-docker.md, "Running
      # behind a reverse proxy") is these two settings with ":80"; the port
      # here is the one the gateway routes to instead.
      SERVER_NAME: ":8080"
      CADDY_GLOBAL_OPTIONS: "auto_https off"
    # The mesh address only. Docker's own iptables rules bypass a host
    # firewall, so a port published on every interface of a host with a
    # public address is reachable from the internet whatever ufw says. The
    # gateway, over the mesh, is the only thing that should reach it.
    ports:
      - "10.44.0.2:8080:8080"
    volumes:
      # Caddy's own state, including the Mercure hub's bolt database.
      - /srv/talk/caddy_data:/data
      - /srv/talk/caddy_config:/config
      - /srv/talk/media:/app/public/media
      # Mbin's own OAuth2 server keypair, for API clients. Not the identity
      # provider's client secret. The image does not generate it: an operator
      # places private.pem (encrypted with OAUTH_PASSPHRASE from .env) and
      # public.pem here, readable by uid 1000, before any API client connects.
      # Read only, so the application cannot rewrite its own signing key. With
      # cluster placement every apps site needs the same pair, or a token one
      # site issues fails on another.
      - /srv/talk/oauth:/app/config/oauth2:ro
      - /srv/talk/php_logs:/app/var/log
      # Upstream binds uploads to the local adapter. The shim switches it to
      # S3; see the comment at the top of that file.
      - /srv/talk/config/packages/oneup_flysystem.yaml:/app/config/packages/oneup_flysystem.yaml:ro
    depends_on:
      amqproxy:
        condition: service_started
      valkey:
        condition: service_healthy

  messenger:
    # The same image as app, always: the consumers run the application's own
    # code, so they are not a service with an image of their own to declare.
    image: ghcr.io/example-org/mbin:v1.10.1-fork
    restart: unless-stopped
    command: bin/console messenger:consume scheduler_default old async outbox deliver inbox resolve receive failed --time-limit=3600
    # Two, not upstream's six: one consumer restarting does not stop
    # federation delivery, at a third of the memory. Raise it when the queue
    # is seen to back up, not before.
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'messenger[:]consume' || exit 1"]
    env_file:
      - .env
    volumes:
      - /srv/talk/media:/app/public/media
      - /srv/talk/messenger_logs:/app/var/log
      - /srv/talk/config/packages/oneup_flysystem.yaml:/app/config/packages/oneup_flysystem.yaml:ro
    depends_on:
      amqproxy:
        condition: service_started
      valkey:
        condition: service_healthy

  amqproxy:
    image: docker.io/cloudamqp/amqproxy:3.2.0
    restart: unless-stopped
    # Upstream's MBIN_USER default. Nothing is mounted, so there is no host
    # ownership for it to match.
    user: "1000:1000"
    command: amqp://rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: docker.io/library/rabbitmq:3.13.7-management-alpine
    restart: unless-stopped
    # Fixed, because RabbitMQ keys its on disk state on the node name, which
    # derives from the hostname. A generated one would orphan the queue on
    # every recreate.
    hostname: rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
    # Only the two variables it reads, rather than the whole .env upstream
    # hands it: a broker has no business holding the database password.
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set in .env}
    volumes:
      # Data only. Upstream also mounts /var/log/rabbitmq, but the image logs
      # to the console (its conf.d/10-defaults.conf sets log.console), and its
      # entrypoint chowns only the data directory, so a root owned log mount
      # would be a directory the broker cannot write to.
      - /srv/talk/rabbitmq_data:/var/lib/rabbitmq

  valkey:
    image: docker.io/valkey/valkey:9.1.2-trixie
    restart: unless-stopped
    # The password is on the command line, as upstream has it, so it is
    # visible to `ps` on the host. valkey.conf is not secret and is rendered
    # 0644 for that reason; the password stays out of it.
    command: valkey-server /valkey.conf --requirepass ${VALKEY_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
    volumes:
      - /srv/talk/valkey.conf:/valkey.conf:ro
