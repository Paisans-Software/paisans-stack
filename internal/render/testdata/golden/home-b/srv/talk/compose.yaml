# Rendered by paisans. Do not edit: `paisans apply` overwrites this file.
#
# talk has cluster placement: no Postgres service of its own, and a
# connection to the local HAProxy on 10.44.0.2:5000.
name: paisans-talk

services:
  app:
    image: ghcr.io/example-org/mbin:v1.10.1-fork
    restart: unless-stopped
    env_file:
      - .env
    # The mesh address only. Docker's own iptables rules bypass a host
    # firewall, so a port published on every interface of a host with a
    # public address is reachable from the internet whatever ufw says. The
    # gateway, over the mesh, is the only thing that should reach it.
    ports:
      - "10.44.0.2:8080:8080"
    volumes:
      - /srv/talk/data:/data
      # Upstream binds uploads to the local adapter. The shim switches it to
      # S3; see the comment at the top of that file.
      - /srv/talk/config/packages/oneup_flysystem.yaml:/app/config/packages/oneup_flysystem.yaml:ro
