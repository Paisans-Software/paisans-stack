# valid.yaml with one thing broken: the homeserver sits behind the members
# gate. A Matrix client will not follow the gate's redirect to a passkey
# prompt, so this ends client login and federation rather than restricting
# either.
version: 1

community:
  name: "Fixture Community"
  domain: example.org

mesh:
  subnet: 10.44.0.0/24

acme:
  provider: desec

sites:
  home-a:
    roles: [data, apps]
    address: 10.44.0.1
    ssh: home-a.local
  home-b:
    roles: [data, apps]
    address: 10.44.0.2
    ssh: home-b.local
  vm:
    roles: [gateway, witness]
    address: 10.44.0.3
    endpoint: vm.example.org:51820
    ssh: vm.example.org

cluster:
  sites: [home-a, home-b]
  port: 5000
  postgres_version: "18"
  synchronous: true
  synchronous_strict: false

etcd:
  members: [home-a, home-b, vm]
  heartbeat_ms: 200
  election_timeout_ms: 2000

storage:
  garage:
    sites: [home-a, home-b]
    replication: 2

apps:
  docs:
    kind: outline
    hostname: docs.example.org
    placement: cluster
    settings:
      s3_bucket: docs-uploads
  auth:
    kind: pocket-id
    hostname: id.example.org
    placement: cluster
    settings:
      file_backend: database
  chat:
    kind: synapse
    hostname: chat.example.org
    placement: { pinned: home-a }
    gate: members
  # Present only so that the gate the homeserver names exists: an app naming a
  # gate no app renders is a different refusal, and a fixture must break one
  # thing.
  gate:
    kind: oauth2-proxy
    hostname: gate.example.org
    placement: { pinned: home-a }
