# paisans.yaml — the whole deployment, declared.
#
# This file is PLAIN and safe to commit. It holds no secrets: those live in
# secrets.enc.yaml, encrypted with sops + age. Keeping them apart means routine
# topology edits — adding an app, changing a hostname — need no decryption key,
# and a change can be reviewed by someone who cannot read the secrets.
#
# It declares INTENT, never STATUS. Which node is currently primary lives in
# etcd and is read with `paisans failover status`. A config file that records
# runtime state drifts, and someone trusts a stale value during an incident.

version: 1
id: f2a9c4e1-0b7d-4c3a-9e2f-5a6b7c8d9e01

community:
  name: "Example Community"
  # ONE-WAY DOOR. Federation identity is the hostname, and remote instances
  # have recorded it. Changing this after federating is a rebuild, not a rename.
  domain: example.org

mesh:
  # The private network every site sits on. Declared, not derived: applications
  # are rendered to trust this subnet for forwarded client addresses, so it has
  # to be a value that never changes. Deriving the tightest network around
  # today's addresses would widen it the moment a site was added, silently
  # rewriting TRUSTED_PROXIES in every app. `paisans init` checks it against
  # every site before the first apply, and rolls a random 10.x.y.0/24 (moving
  # each site's address with it) when it overlaps another deployment's mesh,
  # a route, an address or a Docker network on any of them. Once deployed it
  # never changes.
  subnet: 10.44.0.0/24

# Certificates are issued over DNS-01, always. A gateway has to be able to hold
# valid certificates before DNS points at it, which is what makes moving one an
# overlap rather than a cutover, and a hostname behind a VPN has nothing on the
# internet that can answer an HTTP-01 challenge.
#
# The provider named here decides two things: the directive in the gateway's
# Caddyfile, and which image it runs, since a DNS provider in Caddy is a module
# compiled into the binary rather than a setting.
acme:
  provider: cloudflare        # or desec
  # Only for a provider this toolkit publishes no image for. It must carry that
  # provider's module, and `apply` checks that it does before reloading
  # anything.
  # image: ghcr.io/example-org/caddy-route53:2.11.4

sites:
  home-a:
    roles: [data, apps]
    address: 10.44.0.1          # WireGuard address, stable forever
    # Residential, but dialled: a dynamic DNS name and a forwarded UDP port.
    # Two sites with no endpoint reach each other only through the first site
    # that has one, so with this left out home-a and home-b would talk only
    # through vm, and losing vm would leave each voter alone with no majority:
    # the database read-only everywhere. One home with an endpoint keeps the
    # two homes peered directly, and validate refuses the file without it.
    endpoint: home-a.example.org:51820
    # How the toolkit reaches the site, and who may log in. Every site has
    # one, the gateway included. The keys are public keys, one per line,
    # every admin's: the file is shared, so it never names a private key.
    # Each admin's own ssh offers these and finds its private half in that
    # admin's agent. `host prepare` makes them the user's authorized keys.
    ssh:
      host: home-a.local        # optional: defaults to public_address
      user: ubuntu              # must already exist on the host
      port: 22                  # optional: defaults to 22
      public_key: |
        ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA alice@example.org
        ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEB bob@example.org

  home-b:
    roles: [data, apps]
    address: 10.44.0.2
    endpoint: null              # residential, changing address: dials out
    ssh:
      host: home-b.local
      user: ubuntu
      public_key: |
        ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA alice@example.org
        ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEB bob@example.org

  vm:
    roles: [gateway, witness]
    address: 10.44.0.3
    endpoint: vm.example.org:51820   # stable: the homes dial here
    # What the internet reaches this site on, as the cloud provider reports it
    # rather than as the host's own interface shows it. Optional, and read only
    # by `paisans dns init`, which publishes every hostname below and the
    # endpoint above as A records to it, and as the default ssh.host.
    # Private, carrier grade NAT and mesh addresses are refused.
    # public_address: 203.0.113.10
    # public_address6: 2001:db8::10    # optional, adds AAAA records
    ssh:
      host: vm.example.org      # could be left out with public_address set
      user: ubuntu
      public_key: |
        ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA alice@example.org
        ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEB bob@example.org

  # The uptime monitor's own machine. Never the gateway or the witness: its job
  # is to report their failures, so it must not fail with them. It serves its
  # own hostname from its own address instead of through the gateway, so
  # public_address is required here, and its hostname's record points at it.
  watch:
    roles: [monitor]
    address: 10.44.0.4
    endpoint: watch.example.org:51820
    public_address: 203.0.113.20
    # What is in front of the monitor. Left out, it is mode paisans: the
    # toolkit's own Caddy, the gateway's image, with certificates over DNS-01.
    # On a machine that already runs a web server on 80 and 443, hand the app
    # to that server instead; `paisans ingress show --app status` prints what
    # to put in it, and docs/guides/behind-your-own-web-server.md walks
    # through it.
    # ingress:
    #   mode: external
    #   listen: 127.0.0.1:8480
    ssh:
      host: watch.example.org
      user: ubuntu
      public_key: |
        ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA alice@example.org
        ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEB bob@example.org

# One cluster. Multiple named clusters are out of scope: one cluster holds many
# databases and replicates them together, so every app in it gets HA for free.
# "HA for one app but not another" saves nothing. An app that must not share it
# is `pinned` instead.
cluster:
  sites: [home-a, home-b]
  port: 5000                  # local HAProxy port apps connect to
  postgres_version: "18"
  synchronous: true
  synchronous_strict: false     # degrade to standalone rather than block writes

etcd:
  members: [home-a, home-b, vm]
  # Defaults (100ms / 1000ms) assume one datacenter. Measure real RTT through
  # the tunnel and set these; identical on every member. Leaving the defaults
  # produces phantom elections every time a home connection hiccups.
  heartbeat_ms: 200
  election_timeout_ms: 2000

storage:
  # There is no media hostname here. Each app that stores objects serves them
  # on a hostname of its own, a sibling of the app's: talk.example.org gets
  # talk-media.example.org, and each one needs a DNS record pointing at the
  # gateway. An app can choose another name under `hostnames.media`, as docs
  # does below.
  garage:
    # Preference order, not a set. The first site serves every media read the
    # gateway passes on and takes every app's writes; the rest serve only
    # when the ones before them are down. Put the site with the best upload
    # first: a home line's upload is its slow direction. A new site joins at
    # the end and moves up only after `paisans storage add` has passed.
    sites: [home-a, home-b]
    # A factor of 2 across 2 sites means a write needs both of them: losing a
    # site keeps the database available through failover but stops uploads.
    # That is a trade, not a free win, and it is the reason a third Garage
    # location is worth considering. Validation warns about it on purpose.
    replication: 2
    # consistent (the default), degraded or dangerous. dangerous keeps
    # uploads working with a site down by confirming an upload once one copy
    # exists. Changing replication on a running cluster is `paisans storage
    # add --change-replication`; changing this is an ordinary apply.
    consistency: consistent
    # What each node advertises to Garage's own layout, not a measurement of
    # the disk: the toolkit has no way to know how much of it is meant for
    # objects, so it takes your word and requires the unit suffix Garage
    # does. Defaults to 100G when left unset.
    capacity: 100G
    # Per-site overrides, for nodes of different sizes. A host that exists
    # only for Garage takes `roles: [storage]` and is listed above, at the
    # end until `paisans storage add` has joined it.
    # capacities:
    #   store: 2T

# Every app is rendered with trusted proxies set to the mesh subnet, never to a
# specific host. That is what lets the gateway role move between machines later
# without breaking client-address handling. It is expensive to retrofit and
# fails quietly, so it is not configurable here.
apps:
  talk:
    kind: mbin
    hostname: talk.example.org
    placement: cluster
    # visibility_gate is access policy, and access policy belongs in
    # configuration, not in a hand edited Caddy include somebody has to
    # remember exists. member sends anyone signed in who is not yet a member
    # of the community to the gate's pending page, which is what makes this
    # app member only. Federation still works: ActivityPub goes to Mbin, which
    # this turns signed fetch on for. The gate app itself is declared below.
    visibility_gate: member
    # Its client at Pocket ID is restricted to settings.member_group and
    # settings.admin_group, defaulting to members and admins, and Mbin reads
    # the same two names from the groups claim: the admin group's members
    # become administrators. member_group must be the gate's members_group,
    # which validate checks. Both are left at their defaults here.
    # Optional. Keys are service names in the kind's compose template; any key
    # left out takes the default that kind ships. Declaring the reference is
    # what makes running a fork, or holding a version back, a config edit.
    # `latest` is refused: it makes two runs of `apply` differ from identical
    # inputs. A digest (@sha256:...) is accepted and is the stronger form.
    images:
      app: ghcr.io/example-org/mbin:v1.2.3

  docs:
    kind: outline
    hostname: docs.example.org
    placement: cluster
    settings:
      # Non-AWS S3 endpoints need path style. Upstream bug: the bucket must
      # not be named "outline".
      s3_force_path_style: true
      s3_bucket: docs-uploads
      # Its client at Pocket ID admits only this group and admins. Outline
      # reads no groups claim, so that restriction is the whole control.
      # Optional; members is the default, shown here because it is the one
      # thing deciding who may open the wiki.
      member_group: members
    # Optional. Without it this would be docs-media.example.org, derived from
    # the hostname above. A media hostname is never a child of an app's own
    # hostname (files.docs.example.org would share its cookie scope), and it
    # is never gated: Outline's attachments are private because every URL
    # carries a signature, not because of a cookie.
    hostnames:
      media: attachments.example.org

  auth:
    kind: pocket-id
    hostname: id.example.org
    placement: cluster
    settings:
      # Not `s3`. Uploads are ~1 MB of avatars and branding; in Postgres they
      # ride streaming replication with no sync job, and the service that gates
      # every other one gains no dependency on object storage being up.
      file_backend: database
      # Pocket ID's application configuration. Its admin page for these is
      # read only: they are rendered into its .env, and changing one is an
      # edit here and an apply, which restarts it. Anything left out takes
      # Pocket ID's default. The full list is in README.md, "Pocket ID's
      # configuration is rendered from paisans.yaml".
      app_name: Example ID       # also the sender name on its mail
      session_duration: 10080    # minutes
      allow_user_signups: withToken
      # By name. apply finds or creates each group at the running Pocket ID
      # and records its ID under pocket_id_groups in the secrets.
      signup_default_groups: [provisional]
      email_one_time_access_as_unauthenticated: true

  gate:
    kind: oauth2-proxy
    hostname: gate.example.org
    # Pinned, like every kind that keeps its data outside the cluster: this
    # one keeps none at all, being a session cookie and nothing durable, but
    # it is still refused `cluster` placement because there is no database
    # for it to join. A home rather than the witness, so this example
    # demonstrates only the one deliberate warning below, on chat.
    placement: { pinned: home-a }
    # The gate itself: one kind, two containers. provisional owns the login
    # flow and admits anyone signed in; members carries the group restriction
    # and enforces it. Which applications sit behind which instance is each
    # app's own visibility_gate setting, declared where that app is declared,
    # not here.

  chat:
    kind: synapse
    hostname: chat.example.org
    hostnames:
      # A second name because it serves something different: the apex carries
      # the .well-known delegation documents so a member's identifier reads
      # @name:example.org while the API itself stays on chat.example.org.
      # This is also server_name, permanent from the first account or room.
      wellknown: example.org
    # Pinned: its S3 module supplements the media store rather than replacing
    # it, so a local media directory is always required and it cannot follow a
    # failover cleanly. Pinned means app, database and media together — a
    # half-pinned app is less available than either site.
    placement: { pinned: vm }

  web:
    kind: element
    hostname: web.example.org
    # Pinned, for the same reason the gate is: a static web client keeps
    # nothing in Postgres, so there is no cluster for it to join and `cluster`
    # placement is refused.
    placement: { pinned: home-b }
    settings:
      # The homeserver's API hostname, which becomes base_url. It is NOT
      # server_name: that is the name inside a member's identifier, and the
      # toolkit reads it off the homeserver declared above rather than asking
      # for it twice, because a client whose server_name disagrees with its
      # homeserver offers accounts that do not exist. With the wellknown role
      # set above, members here are @name:example.org while the client talks to
      # chat.example.org.
      homeserver: chat.example.org
      brand: Example Chat

  blog:
    kind: writefreely
    hostname: blog.example.org
    # This kind means the writefreely-wisp fork, not upstream WriteFreely: the
    # fork adds Postgres and S3 support upstream does not have, so the blog
    # could join the cluster like any other app. It is pinned here as an
    # ordinary choice, not a forced one: pinning to a home is as valid as
    # pinning to the gateway, and its availability is that site's.
    placement: { pinned: home-a }
    settings:
      # WriteFreely reads config.ini rather than an environment, and this is
      # what the [app] section is rendered from. A rendered file carrying a
      # client secret is written 0600 and bind mounted, where `docker inspect`
      # cannot reach it.
      site_name: Example Community
      oidc_display_name: Example
      # As for docs: the client admits only member_group (default members)
      # and admins, and WriteFreely reads no groups claim.
    # Not settings. A settings key works only if a template asks for it by
    # name, and one no template reads is ignored without a word. A config key
    # is passed through as written: here, max_blogs inside config.ini's
    # existing [app] section. The toolkit does not interpret it, and refuses
    # one the template already writes, such as app.site_name, rather than let
    # it override the setting above. The fork moves [app] into its database on
    # its first start, so a key added later is ignored; see the README.
    config:
      app.max_blogs: 3

  status:
    kind: uptime
    hostname: status.example.org
    # The uptime monitor. Pinned only, and only to a site holding the monitor
    # role: it keeps SQLite on local disk, and it must not go dark with the
    # gateway it reports on. Its monitors are not declared here: every app
    # gets a public and a direct check, every other site a ping, and the
    # monitor one check of its own public URL, generated from this file.
    placement: { pinned: watch }
    settings:
      # Required. Only members of this identity provider group may sign in.
      admin_group: admins
    # Optional, any field of the smtp block below; the rest is inherited.
    # smtp:
    #   from_name: Example Status

# How apps that send mail send it: the uptime monitor's alerts, and Pocket
# ID's login codes and notices, which go out under its app_name rather than
# from_name.
# Each app may override any field in its own smtp block. The password is a
# secret: apps.<app>.smtp_password if set, else external.smtp_password.
smtp:
  host: smtp.example.org
  port: 587
  security: starttls          # or tls
  username: status@example.org
  from_address: status@example.org
  from_name: Example Community
