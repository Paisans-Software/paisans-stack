# secrets.enc.yaml — shown here DECRYPTED, for illustration only.
#
# The real file is encrypted with sops + age and IS committed. sops encrypts
# values but not keys, so the committed file looks like this:
#
#   clusters:
#       main:
#           superuser_password: ENC[AES256_GCM,data:8mK2p...,tag:9dQ==,type:str]
#   sops:
#       age:
#           - recipient: age1ql3z7hjy54pw3hyww5ayyfg7zqgvc7w3j2elw8zmrj2kg5sfn9aq...
#
# You can therefore see WHICH secrets exist, and review that a change touched
# the expected entry, without being able to read any of them.
#
# Never commit this file in the form below.
#
#   sops secrets.enc.yaml               edit (decrypts to $EDITOR, re-encrypts on save)
#   sops -d secrets.enc.yaml            decrypt to stdout, for rendering
#   sops updatekeys secrets.enc.yaml    after changing the recipient list
#
# Recipients are configured in .sops.yaml — one age public key per admin.
# Adding or removing an admin is a re-encrypt, not a secret rotation.
#
# WARNING: the age private keys are now the unrecoverable thing. Lose every
# admin's key and this file is landfill. Back the keys up separately from the
# repo they decrypt.

version: 1

# ── GENERATED at `paisans init`. Never typed, never seen, never reused. ──────
clusters:
  main:
    superuser_password: "generated-at-init"
    admin_password: "generated-at-init"
    standby_password: "generated-at-init"

storage:
  garage:
    admin_token: "generated-at-init"
    access_key_id: "generated-at-init"
    secret_access_key: "generated-at-init"

sites:
  home-a: { wireguard_private_key: "generated-at-init" }
  home-b: { wireguard_private_key: "generated-at-init" }
  vm:     { wireguard_private_key: "generated-at-init" }

apps:
  talk:
    mercure_jwt_secret: "generated-at-init"
    rabbitmq_password: "generated-at-init"
    valkey_password: "generated-at-init"

# ── PASTED. Issued by someone else; the toolkit cannot invent them. ──────────
external:
  cloudflare_api_token: "paste-me"      # Zone:DNS:Edit on this zone only
  smtp_password: "paste-me"

# ── CAPTURED. Minted by a running service, then recorded here. ──────────────
#
# Pocket ID mints a client secret; the app needs the identical value. Recording
# it here makes it reproducible rather than existing on exactly one host.
#
# Minting one is a Pocket ID client mutation and is approval-required EVERY
# time, per the Charter. The toolkit must not automate that gate away — it
# takes the value after a human has approved and run the mint.
oidc_clients:
  talk:
    client_id: "captured-from-pocket-id"
    client_secret: "captured-from-pocket-id"
  docs:
    client_id: "captured-from-pocket-id"
    client_secret: "captured-from-pocket-id"
